# Metadata-only export of Secrets needs the permission to read Secrets in these namespaces.
# That permission also allows reading VALUES. The Job asks the API server for metadata only
# (PartialObjectMetadataList), checks that no data came back, and drops the last-applied-configuration annotation.
# Keep the list short. One Role per namespace, read only. Must match SECRET_NAMESPACES in config.yaml (tsb, istio-system).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-k8s-secrets-metadata
  namespace: tsb
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-k8s-secrets-metadata
  namespace: tsb
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: backup-k8s-secrets-metadata}
subjects:
  - {kind: ServiceAccount, name: preflight-backup-k8s-objects, namespace: preflight}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-k8s-secrets-metadata
  namespace: istio-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-k8s-secrets-metadata
  namespace: istio-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: backup-k8s-secrets-metadata}
subjects:
  - {kind: ServiceAccount, name: preflight-backup-k8s-objects, namespace: preflight}
