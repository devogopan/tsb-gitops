# One Application per folder in clusters/. Folder name = Argo CD cluster name.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preflight-cluster-health
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: git@github.com:devogopan/tsb-gitops.git
        revision: main
        directories:
          - path: preflight/steps/cluster-health/clusters/*
  template:
    metadata:
      name: 'preflight-cluster-health-{{path.basename}}'
      labels:
        app.kubernetes.io/part-of: preflight-cluster-health
    spec:
      project: tsb
      source:
        repoURL: git@github.com:devogopan/tsb-gitops.git
        targetRevision: main
        path: '{{path}}'
      destination:
        name: '{{path.basename}}'
        namespace: preflight
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true
