apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - job.yaml
# The script that runs inside the Postgres pod, kept as a file so it can be reviewed and tested alone.
configMapGenerator:
  - name: backup-postgres-script
    namespace: preflight
    files:
      - remote.sh
generatorOptions:
  disableNameSuffixHash: true
