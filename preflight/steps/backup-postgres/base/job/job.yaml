apiVersion: batch/v1
kind: Job
metadata:
  name: backup-postgres
  namespace: preflight
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
    # Job pod templates are immutable. Apply this hook normally so the old Job is replaced.
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: preflight-backup-postgres
      containers:
        - name: backup
          image: docker.io/alpine/k8s:1.34.13
          envFrom:
            - configMapRef: {name: backup-postgres-shared}    # shared: RUN_ID
            - configMapRef: {name: backup-postgres-cluster}   # this cluster: pod, database, paths
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              CM="preflight-${RUN_ID}"
              for t in kubectl jq base64 gzip zcat sha256sum du df; do
                command -v "$t" >/dev/null || { echo "missing tool in image: $t"; exit 1; }
              done
              REASONS=""; POD=""; CONT=""; FILE_PATH=""; SIZE=""; SHA=""; DBSIZE=""; USED_MB=""
              addr() { REASONS="${REASONS:+$REASONS; }$1"; echo "FAIL: $1"; }
              echo "cluster=${CLUSTER_NAME} run=${RUN_ID} db=${PG_DB} user=${PG_USER} dir=${BACKUP_DIR} limit=${BACKUP_LIMIT_MB}MB"

              # runs a command in the Postgres pod. The password goes in on stdin, never on a command line.
              pgexec() { printf '%s\n' "$PW" | kubectl -n "$POSTGRES_NAMESPACE" exec -i "$POD" -c "$CONT" -- \
                sh -c 'IFS= read -r PGPASSWORD; export PGPASSWORD; '"$1" sh "$PG_USER" "$PG_DB"; }

              run_backup() {
                # 0. the backup volume
                [ -d /backups ] && [ -w /backups ] || { addr "/backups is not mounted or not writable (is the PVC preflight-backups there?)"; return; }
                mkdir -p "$BACKUP_DIR" || { addr "cannot create $BACKUP_DIR"; return; }

                # 1. exactly one running Postgres pod
                PODS="$(kubectl -n "$POSTGRES_NAMESPACE" get pods -l "$POSTGRES_POD_SELECTOR" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null)"
                N="$(printf '%s' "$PODS" | grep -c . || true)"
                if [ "$N" != "1" ]; then addr "expected exactly one pod for selector '$POSTGRES_POD_SELECTOR' in $POSTGRES_NAMESPACE, found $N"; return; fi
                POD="$PODS"
                PHASE="$(kubectl -n "$POSTGRES_NAMESPACE" get pod "$POD" -o jsonpath='{.status.phase}' 2>/dev/null)"
                [ "$PHASE" = "Running" ] || { addr "pod $POD is $PHASE, not Running"; return; }
                CONT="${POSTGRES_CONTAINER:-}"
                [ -n "$CONT" ] || CONT="$(kubectl -n "$POSTGRES_NAMESPACE" get pod "$POD" -o jsonpath='{.spec.containers[0].name}' 2>/dev/null)"
                [ -n "$CONT" ] || { addr "cannot read the container name of pod $POD"; return; }
                echo "pod=$POD container=$CONT"

                # 2. the password (one Secret, read by name)
                SJSON="$(kubectl -n "$POSTGRES_NAMESPACE" get secret "$PG_SECRET" -o json 2>/dev/null)" || { addr "cannot read secret $PG_SECRET in $POSTGRES_NAMESPACE"; return; }
                PW="$(printf '%s' "$SJSON" | jq -r --arg k "$PG_SECRET_KEY" '.data[$k] // empty' | base64 -d 2>/dev/null)"
                if [ -z "$PW" ]; then
                  addr "secret $PG_SECRET has no key '$PG_SECRET_KEY' (keys: $(printf '%s' "$SJSON" | jq -r '.data | keys | join(",")'))"
                  return
                fi

                # 3. room on the backup volume. The database size is a safe upper bound for the compressed dump.
                DBSIZE="$(pgexec 'psql -U "$1" -d "$2" -tAc "select pg_database_size(current_database())"' 2>/dev/null)"
                case "$DBSIZE" in ''|*[!0-9]*) addr "cannot read the size of database $PG_DB (wrong user, password or database?)"; return ;; esac
                NEED_KB=$(( DBSIZE / 1024 + 1 ))
                USED_KB="$(du -sk /backups | cut -f1)"; USED_MB=$(( USED_KB / 1024 ))
                AVAIL_KB="$(df -Pk /backups | tail -1 | awk '{print $4}')"
                ROOM_KB=$(( BACKUP_LIMIT_MB * 1024 - USED_KB ))
                [ "$AVAIL_KB" -ge "$ROOM_KB" ] || ROOM_KB="$AVAIL_KB"
                echo "database ${NEED_KB} KB, backup volume used ${USED_KB} KB, room ${ROOM_KB} KB"
                [ "$ROOM_KB" -ge "$NEED_KB" ] || { addr "not enough room on the backup volume: ${ROOM_KB} KB left under the ${BACKUP_LIMIT_MB} MB limit, the database is ${NEED_KB} KB"; return; }

                # 4. dump, streamed out of the Postgres pod into the backup volume. Written as .part, renamed only when verified.
                FILE="${PG_DB}-${RUN_ID}-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                PART="$BACKUP_DIR/$FILE.part"; ERRF="$(mktemp)"; RCF="$(mktemp)"
                { pgexec 'exec pg_dump -U "$1" "$2"' 2>"$ERRF"; echo $? > "$RCF"; } | gzip > "$PART"
                PW=""
                RC="$(cat "$RCF" 2>/dev/null || echo 99)"
                [ ! -s "$ERRF" ] || { echo "pg_dump said:"; sed 's/^/  /' "$ERRF"; }
                [ "$RC" = "0" ] || { rm -f "$PART"; addr "pg_dump through kubectl exec failed with exit code $RC"; return; }
                gzip -t "$PART" 2>/dev/null || { rm -f "$PART"; addr "the dump is not a valid gzip file"; return; }
                zcat "$PART" | tail -n 5 | grep -q 'PostgreSQL database dump complete' || { rm -f "$PART"; addr "the dump has no 'PostgreSQL database dump complete' trailer, it is incomplete"; return; }
                SIZE="$(wc -c < "$PART" | tr -d ' ')"
                [ "$SIZE" -ge "$MIN_BYTES" ] || { rm -f "$PART"; addr "the dump is only $SIZE bytes (minimum $MIN_BYTES)"; return; }
                mv "$PART" "$BACKUP_DIR/$FILE"
                ( cd "$BACKUP_DIR" && sha256sum "$FILE" > "$FILE.sha256" ) || { addr "cannot write the checksum file"; return; }
                SHA="$(cut -d' ' -f1 "$BACKUP_DIR/$FILE.sha256")"
                FILE_PATH="$BACKUP_DIR/$FILE"

                # 5. read it back from the volume: the stored file must still match its checksum
                ( cd "$BACKUP_DIR" && sha256sum -c "$FILE.sha256" >/dev/null 2>&1 ) || { addr "read-back failed: $FILE_PATH does not match its sha256"; return; }

                # 6. keep the newest KEEP_BACKUPS dumps of this database (and their checksum files)
                ls -1t "$BACKUP_DIR"/"$PG_DB"-*.sql.gz 2>/dev/null | tail -n +$(( KEEP_BACKUPS + 1 )) | while IFS= read -r old; do
                  rm -f "$old" "$old.sha256"; echo "pruned $old"
                done
                USED_MB=$(( $(du -sk /backups | cut -f1) / 1024 ))
                echo "PASS: $FILE_PATH, $SIZE bytes, sha256 $SHA (backup volume now ${USED_MB} MB of ${BACKUP_LIMIT_MB} MB)"
              }
              run_backup

              STATUS=success; [ -z "$REASONS" ] || STATUS=failed
              NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              kubectl -n preflight get configmap "$CM" >/dev/null 2>&1 || kubectl -n preflight create configmap "$CM" >/dev/null
              kubectl -n preflight patch configmap "$CM" --type merge -p "$(jq -n \
                --arg s "$STATUS" --arg c "$CLUSTER_NAME" --arg pod "$POD" --arg db "$PG_DB" --arg f "$FILE_PATH" \
                --arg sz "$SIZE" --arg sha "$SHA" --arg dbs "$DBSIZE" --arg um "$USED_MB" --arg lm "$BACKUP_LIMIT_MB" --arg r "$REASONS" --arg t "$NOW" \
                '{data:{"backup-postgres":$s,"backup-postgres.cluster":$c,"backup-postgres.pod":$pod,"backup-postgres.database":$db,"backup-postgres.file":$f,"backup-postgres.sizeBytes":$sz,"backup-postgres.sha256":$sha,"backup-postgres.databaseBytes":$dbs,"backup-postgres.volumeUsedMB":$um,"backup-postgres.volumeLimitMB":$lm,"backup-postgres.storage":"pvc preflight-backups (same node disk on kind)","backup-postgres.reason":$r,"backup-postgres.completedAt":$t}}')" \
                || { echo "could not write evidence"; exit 1; }
              echo "RESULT: $STATUS"
              [ "$STATUS" = "success" ] || exit 1
          volumeMounts:
            - {name: backups, mountPath: /backups}
      volumes:
        - name: backups
          persistentVolumeClaim: {claimName: preflight-backups}
