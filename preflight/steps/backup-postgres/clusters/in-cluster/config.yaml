# Settings for the cluster that runs Postgres (the management plane cluster). Folder name = Argo CD cluster name.
# Only MP clusters get a folder here: control plane clusters have no Postgres.
#
# STORAGE: the dump is written into the Postgres pod's own data volume (next to, not inside, PGDATA).
# That is the same disk as the database. It proves the dump works, it does NOT protect against losing the disk.
# The evidence says so (backup-postgres.storage). Production must use a separate volume or a bucket.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-postgres-cluster
  namespace: preflight
data:
  CLUSTER_NAME: "in-cluster"
  POSTGRES_NAMESPACE: "tsb"
  # exactly ONE pod must match. Kubegres labels the primary replicationRole=primary. Verify with
  #   kubectl -n tsb get pods --show-labels | grep postgres
  POSTGRES_POD_SELECTOR: "app=tsb-postgres,replicationRole=primary"
  # empty = the first container of the pod (the second is postgres-exporter)
  POSTGRES_CONTAINER: ""
  PG_USER: "tsb"
  PG_DB: "tsb"
  PG_SECRET: "postgres-credentials"
  PG_SECRET_KEY: "password"
  # inside the pod, a sibling of PGDATA (PGDATA is usually /var/lib/postgresql/data/pgdata)
  BACKUP_DIR: "/var/lib/postgresql/data/backups"
  KEEP_BACKUPS: "5"
  # the volume must still be at least this percent free after the dump (it also holds the database)
  MIN_FREE_PERCENT: "20"
  MIN_BYTES: "1000"
