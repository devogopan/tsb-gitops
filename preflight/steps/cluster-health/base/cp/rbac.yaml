# Only for clusters that run the control plane (namespace istio-system).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-health-reader
  namespace: istio-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["install.tetrate.io"]
    resources: ["controlplanes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-health-reader
  namespace: istio-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-health-reader}
subjects:
  - {kind: ServiceAccount, name: preflight-cluster-health, namespace: preflight}
