# Read-only checks. Needs a ClusterRole because nodes and StorageClasses are cluster-scoped.
# The AppProject must allow ClusterRole and ClusterRoleBinding (see ClusterHealth-Setup.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preflight-cluster-health
  namespace: preflight
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-health-evidence
  namespace: preflight
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-health-evidence
  namespace: preflight
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-health-evidence}
subjects:
  - {kind: ServiceAccount, name: preflight-cluster-health, namespace: preflight}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preflight-cluster-health
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preflight-cluster-health
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: preflight-cluster-health}
subjects:
  - {kind: ServiceAccount, name: preflight-cluster-health, namespace: preflight}
