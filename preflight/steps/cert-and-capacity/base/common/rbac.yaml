# Cluster-wide part: read namespaces and the TSB gateway install objects (to find the namespaces where gateways run).
# The AppProject must allow ClusterRole and ClusterRoleBinding (argocd-config/appproject-tsb.yaml).
# Reading certificates needs Roles per namespace: see clusters/<name>/cert-rbac.yaml.
# Reading the Postgres disk needs a Role in tsb: see clusters/in-cluster/postgres-rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preflight-cert-and-capacity
  namespace: preflight
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-and-capacity-evidence
  namespace: preflight
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-and-capacity-evidence
  namespace: preflight
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cert-and-capacity-evidence}
subjects:
  - {kind: ServiceAccount, name: preflight-cert-and-capacity, namespace: preflight}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preflight-cert-and-capacity
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # the gateway types are found from the CRDs, so the CRDs must be readable
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # the gateway install objects (IngressGateway, EgressGateway, Tier1Gateway ...) live in this group. Read only.
  - apiGroups: ["install.tetrate.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preflight-cert-and-capacity
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: preflight-cert-and-capacity}
subjects:
  - {kind: ServiceAccount, name: preflight-cert-and-capacity, namespace: preflight}
