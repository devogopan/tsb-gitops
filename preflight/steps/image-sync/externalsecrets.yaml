# env vars for tctl image-sync
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tetrate-sync-creds
  namespace: preflight
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: doppler}
  target:
    name: tetrate-sync-creds
    template:
      data:
        TCTL_IMAGE_SYNC_USERNAME: "{{ .username }}"
        TCTL_IMAGE_SYNC_APIKEY: "{{ .apikey }}"
  data:
    - secretKey: username
      remoteRef: {key: TETRATE_USERNAME}
    - secretKey: apikey
      remoteRef: {key: TETRATE_APIKEY}
---
# image pull secret so the cluster can pull the tctl image
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tetrate-pull
  namespace: preflight
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: doppler}
  target:
    name: tetrate-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"containers.dl.tetrate.io":{"username":"{{ .username }}","password":"{{ .apikey }}","auth":"{{ printf "%s:%s" .username .apikey | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: {key: TETRATE_USERNAME}
    - secretKey: apikey
      remoteRef: {key: TETRATE_APIKEY}
