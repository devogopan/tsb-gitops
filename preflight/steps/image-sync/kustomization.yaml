apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: preflight
resources:
  - secretstore.yaml
  - externalsecrets.yaml
  - rbac.yaml
  - config.yaml
  - job.yaml
# Single source of truth for the version: config.yaml TSB_VERSION
# sets the tctl image tag, so a version bump is a one-line change.
replacements:
  - source:
      kind: ConfigMap
      name: image-sync-config
      fieldPath: data.TSB_VERSION
    targets:
      - select:
          kind: Job
          name: image-sync
        fieldPaths:
          - spec.template.spec.initContainers.[name=sync].image
        options:
          delimiter: ":"
          index: 1
  - source:
      kind: ConfigMap
      name: image-sync-config
      fieldPath: data.TARGET_REGISTRY
    targets:
      - select:
          kind: Job
          name: image-sync
        fieldPaths:
          - spec.template.spec.initContainers.[name=sync].args.3
        options:
          delimiter: "="
          index: 1
