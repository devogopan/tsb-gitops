# Namespaced store: no cluster-scoped permissions needed in the AppProject.
# The token Secret "doppler-token" is created by hand once (never in Git).
# To change backend (Infisical, Vault, ...) only this file changes.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: doppler
  namespace: preflight
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: dopplerToken
      project: tsb-upgrade
      config: dev
