# Settings for ONE cluster. The folder name must be the cluster's NAME in Argo CD (`argocd cluster list`).
#   MIN_TESTS         fewer tests in the report than this fails the step (proves the suites were really mounted and run)
#   BACKUP_DIR        a folder on the backup volume (PVC preflight-backups)
#   KEEP_REPORTS      newest runs to keep per cluster (each run = one report .json and one log, each with a .sha256)
#   BACKUP_LIMIT_MB   everything under /backups (all steps) must stay below this. Keep equal to the PVC size (250Mi).
#   WAIT_MAX_SECONDS  how long the report container waits for chainsaw to finish
apiVersion: v1
kind: ConfigMap
metadata:
  name: chainsaw-pre-cluster
  namespace: preflight
data:
  CLUSTER_NAME: "cp-2"
  MIN_TESTS: "2"
  BACKUP_DIR: "/backups/chainsaw"
  KEEP_REPORTS: "10"
  BACKUP_LIMIT_MB: "250"
  WAIT_MAX_SECONDS: "900"
