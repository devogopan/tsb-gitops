apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - job.yaml
# The Tetrate script is shipped unchanged, as a ConfigMap. The Job prints its sha256 into the evidence.
configMapGenerator:
  - name: content-hash-script
    namespace: preflight
    files:
      - content-hash.sh
generatorOptions:
  disableNameSuffixHash: true
