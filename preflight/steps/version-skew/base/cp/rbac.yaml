# Only for clusters that run the control plane (namespace istio-system).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: version-skew-reader
  namespace: istio-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: version-skew-reader
  namespace: istio-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: version-skew-reader}
subjects:
  - {kind: ServiceAccount, name: preflight-version-skew, namespace: preflight}
